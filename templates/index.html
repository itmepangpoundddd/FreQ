<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ FreQ — Radio Playlist Manager</title>
  <style>
    /* ═══════════════════════════════════════
       CSS Variables & Reset
       ═══════════════════════════════════════ */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2128;
      --bg-hover: #21262d;
      --bg-active: #1f6feb22;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-orange: #d29922;
      --accent-purple: #bc8cff;
      --accent-pink: #f778ba;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════
       Layout
       ═══════════════════════════════════════ */
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1040 0%, #0d1117 50%, #0a1628 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Main Content ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-left: none !important; border-top: 1px solid var(--border); }
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
    }

    .sidebar-tab {
      flex: 1;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      transition: var(--transition);
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .sidebar-tab:hover { color: var(--text-primary); }
    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-content::-webkit-scrollbar { width: 6px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Queue Panel ── */
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .queue-header h3 {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .queue-stats {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Song Item ── */
    .song-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: grab;
      transition: var(--transition);
      border: 1px solid transparent;
      margin-bottom: 2px;
      position: relative;
    }

    .song-item:hover {
      background: var(--bg-hover);
      border-color: var(--border);
    }

    .song-item.playing {
      background: var(--bg-active);
      border-color: var(--accent);
    }

    .song-item.dragging {
      opacity: 0.5;
      border-color: var(--accent);
      background: var(--bg-active);
    }

    .song-item.drag-over {
      border-top: 2px solid var(--accent);
    }

    .song-drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 1rem;
      user-select: none;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
    }

    .song-thumb {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--bg-hover);
      flex-shrink: 0;
    }

    .song-thumb-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--bg-hover), var(--bg-card));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .song-duration {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .song-source-badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-yt { background: #ff000022; color: #ff4444; }
    .badge-local { background: var(--accent-green); color: #000; }

    .song-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: var(--transition);
    }

    .song-item:hover .song-actions { opacity: 1; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn:hover { background: var(--bg-hover); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #4c9aed; }

    .btn-danger {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }
    .btn-danger:hover { opacity: 0.85; }

    .btn-success {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
    }

    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      font-size: 0.9rem;
    }

    /* ── Input ── */
    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus { border-color: var(--accent); }

    input::placeholder { color: var(--text-muted); }

    /* ── Forms ── */
    .form-section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .form-section:last-child { border-bottom: none; }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row {
      display: flex;
      gap: 6px;
    }

    /* ── Now Playing Bar ── */
    .now-playing {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .np-thumb {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--bg-hover);
    }

    .np-thumb-placeholder {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #1a1040, #0a1628);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent); }
      50% { box-shadow: 0 0 20px 4px var(--accent); }
    }

    .np-info { flex: 1; min-width: 0; }

    .np-title {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-artist {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .np-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .np-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--bg-hover);
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .np-btn:hover { background: var(--border); }

    .np-btn-play {
      width: 48px;
      height: 48px;
      background: var(--accent);
      color: #fff;
      font-size: 1.3rem;
    }

    .np-btn-play:hover { background: #4c9aed; }

    .np-position {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 80px;
      text-align: center;
    }

    /* ── Queue Content (left panel) ── */
    .queue-panel {
      padding: 20px;
      overflow-y: auto;
    }

    .queue-panel::-webkit-scrollbar { width: 6px; }
    .queue-panel::-webkit-scrollbar-track { background: transparent; }
    .queue-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-size: 1rem; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-state p { font-size: 0.85rem; }

    /* ── Notification Toast ── */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 9999;
      animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s;
      box-shadow: var(--shadow);
    }

    .toast-success { background: var(--accent-green); color: #000; }
    .toast-error { background: var(--accent-red); color: #fff; }
    .toast-info { background: var(--accent); color: #fff; }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toast-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* ── Loading Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--text-muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Library Items ── */
    .library-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 2px;
    }

    .library-item:hover { background: var(--bg-hover); }

    .library-item .song-title { font-size: 0.8rem; }
    .library-item .song-artist { font-size: 0.7rem; }

    /* ── Preset Items ── */
    .preset-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      transition: var(--transition);
    }

    .preset-item:hover { border-color: var(--accent); }

    .preset-name {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .preset-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── History Items ── */
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      margin-bottom: 2px;
      opacity: 0.7;
    }

    .history-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Misc ── */
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-accent { color: var(--accent); }
    .text-center { text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .flex-1 { flex: 1; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    /* ── Search Input ── */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      padding-left: 32px;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ═══════ HEADER ═══════ -->
  <header class="header">
    <div class="header-left">
      <h1>🎙️ FreQ</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="saveAll()">💾 Save</button>
      <button class="btn btn-sm" onclick="loadAll()">📂 Load</button>
      <button class="btn btn-sm btn-primary" onclick="loadDemo()">🎵 Load Demo</button>
    </div>
  </header>

  <!-- ═══════ MAIN ═══════ -->
  <div class="main">

    <!-- ── Left: Queue ── -->
    <div class="queue-panel" id="queuePanel">
      <div class="queue-header">
        <h3>📋 Queue</h3>
        <span class="queue-stats" id="queueStats"></span>
      </div>
      <div id="queueList"></div>
    </div>

    <!-- ── Right: Sidebar ── -->
    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="add" onclick="switchTab('add')">➕ Add Song</button>
        <button class="sidebar-tab" data-tab="library" onclick="switchTab('library')">📚 Library</button>
        <button class="sidebar-tab" data-tab="presets" onclick="switchTab('presets')">📂 Preset</button>
        <button class="sidebar-tab" data-tab="history" onclick="switchTab('history')">📜 History</button>
        <button class="sidebar-tab" data-tab="log" onclick="switchTab('log')">📋 Log</button>
      </div>

      <div class="sidebar-content">

        <!-- TAB: Add Song -->
        <div class="tab-panel active" id="tab-add">
          <!-- YouTube URL -->
          <div class="form-section">
            <span class="form-label">🔗 Add from YouTube</span>
            <div class="input-group">
              <input type="text" id="ytUrl" placeholder="Paste YouTube URL here...">
              <button class="btn btn-primary" onclick="addYouTube()" id="btnYtAdd">➕</button>
            </div>
            <div class="input-group">
              <input type="text" id="ytPlaylistUrl" placeholder="Paste YouTube Playlist URL...">
              <button class="btn btn-success" onclick="addYouTubePlaylist()" id="btnYtPlaylist">📋 Playlist</button>
            </div>
          </div>

          <!-- Manual Add -->
          <div class="form-section">
            <span class="form-label">✏️ Add Manually</span>
            <input type="text" id="manualTitle" placeholder="Song title" class="mb-2">
            <input type="text" id="manualArtist" placeholder="Artist (optional)" class="mb-2">
            <div class="form-row mb-2">
              <input type="number" id="manualDuration" placeholder="Duration (seconds)">
            </div>
            <button class="btn btn-primary" style="width:100%" onclick="addManual()">➕ Add Song</button>
          </div>

          <!-- Quick Insert -->
          <div class="form-section">
            <span class="form-label">📌 Insert Song at Position</span>
            <div class="form-row mb-2">
              <input type="number" id="insertPosition" placeholder="Position" style="width:70px; flex:none;">
              <input type="text" id="insertTitle" placeholder="Song title">
            </div>
            <div class="form-row">
              <input type="text" id="insertArtist" placeholder="Artist">
              <input type="number" id="insertDuration" placeholder="Seconds" style="width:80px; flex:none;">
            </div>
            <button class="btn btn-primary mt-2" style="width:100%" onclick="insertSong()">📌 Insert</button>
          </div>

          <!-- Clear -->
          <div class="form-section" style="border-bottom:none;">
            <button class="btn btn-danger" style="width:100%" onclick="clearQueue()">🗑️ Clear entire queue</button>
          </div>
        </div>

        <!-- TAB: Library -->
        <div class="tab-panel" id="tab-library">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search songs..." oninput="searchLibrary()">
          </div>
          <div id="libraryList"></div>
        </div>

        <!-- TAB: Presets -->
        <div class="tab-panel" id="tab-presets">
          <div class="form-section">
            <span class="form-label">💾 Save Queue as Preset Preset</span>
            <div class="input-group">
              <input type="text" id="presetName" placeholder="Preset name">
              <button class="btn btn-primary" onclick="savePreset()">💾</button>
            </div>
          </div>
          <div id="presetList"></div>
        </div>

        <!-- TAB: History -->
        <div class="tab-panel" id="tab-history">
          <div id="historyList"></div>
        </div>

        <!-- TAB: Log -->
        <div class="tab-panel" id="tab-log">
          <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
            <select id="logLevel" style="flex:1; padding:6px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary); font-size:0.8rem;">
              <option value="DEBUG">DEBUG</option>
              <option value="INFO">INFO</option>
              <option value="WARNING">WARNING</option>
              <option value="ERROR">ERROR</option>
            </select>
            <button class="btn btn-sm" onclick="refreshLogs()">🔄</button>
            <button class="btn btn-sm btn-danger" onclick="clearLogs()">🗑️</button>
          </div>
          <div id="logCount" style="font-size:0.7rem; color:var(--text-muted); margin-bottom:6px;">0 entries</div>
          <div id="logViewer" style="background:var(--bg-primary); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; max-height:400px; overflow-y:auto; font-family:Consolas,monospace; font-size:0.75rem; line-height:1.5; white-space:pre-wrap; word-break:break-all;"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════ NOW PLAYING BAR ═══════ -->
  <div class="now-playing" id="nowPlaying">
    <div class="np-thumb-placeholder" id="npThumb">🎙️</div>
    <div class="np-info">
      <div class="np-title" id="npTitle">No song playing</div>
      <div class="np-artist" id="npArtist">Select a song from queue to start</div>
    </div>
    <div class="np-position" id="npPosition">-- / --</div>
    <div class="np-controls">
      <button class="np-btn" onclick="prevTrack()" title="Previous song">⏮</button>
      <button class="np-btn np-btn-play" id="btnPlayPause" onclick="togglePlay()" title="Play / Pause">▶️</button>
      <button class="np-btn" onclick="nextTrack()" title="Next song">⏭</button>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════
// State
// ═══════════════════════════════════════
let queueData = [];
let currentIndex = -1;
let isPlaying = false;
let dragSrcIndex = null;

// ═══════════════════════════════════════
// API Helpers
// ═══════════════════════════════════════
async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ═══════════════════════════════════════
// Queue Rendering
// ═══════════════════════════════════════
async function refreshQueue() {
  const data = await api('/api/queue');
  queueData = data.queue;
  currentIndex = data.current_index;
  renderQueue(data.total_duration);
  updateNowPlaying();
}

function formatDuration(secs) {
  const s = Math.floor(secs);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderQueue(totalDuration) {
  const container = document.getElementById('queueList');
  const stats = document.getElementById('queueStats');

  if (queueData.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <h3>Queue is empty</h3>
        <p>Add songs from YouTube or add manually</p>
      </div>`;
    stats.textContent = '';
    return;
  }

  stats.textContent = `${queueData.length} songs · ${formatDuration(totalDuration)}`;

  container.innerHTML = queueData.map((song, i) => {
    const isCurrent = i === currentIndex;
    const isPlayingThis = isCurrent && isPlaying;
    const thumb = song.thumbnail
      ? `<img class="song-thumb" src="${song.thumbnail}" alt="" onerror="this.outerHTML='<div class=\\'song-thumb-placeholder\\'>🎵</div>'">`
      : `<div class="song-thumb-placeholder">${song.source === 'youtube' ? '🔗' : '🎵'}</div>`;
    const sourceBadge = song.source === 'youtube'
      ? '<span class="song-source-badge badge-yt">YT</span>'
      : '';
    const statusIcon = isPlayingThis ? '▶️' : isCurrent ? '⏸️' : '';

    return `
      <div class="song-item ${isCurrent ? 'playing' : ''}"
           draggable="true"
           data-index="${i}"
           ondragstart="onDragStart(event)"
           ondragover="onDragOver(event)"
           ondragenter="onDragEnter(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event)"
           ondragend="onDragEnd(event)"
           ondblclick="playFromQueue(${i})">
        <span class="song-drag-handle" title="Drag to reorder">☰</span>
        ${thumb}
        <div class="song-info">
          <div class="song-title">${statusIcon} ${escHtml(song.title)}</div>
          <div class="song-artist">${escHtml(song.artist || '—')}</div>
        </div>
        <div class="song-meta">
          ${sourceBadge}
          <span class="song-duration">${formatDuration(song.duration)}</span>
        </div>
        <div class="song-actions">
          <button class="btn btn-sm btn-icon" onclick="playFromQueue(${i})" title="Play">▶️</button>
          <button class="btn btn-sm btn-icon" onclick="removeFromQueue(${i})" title="Remove">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════
// Drag & Drop
// ═══════════════════════════════════════
function onDragStart(e) {
  dragSrcIndex = parseInt(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function onDragEnter(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const toIndex = parseInt(e.currentTarget.dataset.index);
  if (dragSrcIndex !== null && dragSrcIndex !== toIndex) {
    reorderSong(dragSrcIndex, toIndex);
  }
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('drag-over'));
  dragSrcIndex = null;
}

async function reorderSong(from, to) {
  await api('/api/queue/reorder', 'POST', { from, to });
  refreshQueue();
}

// ═══════════════════════════════════════
// Playback Controls
// ═══════════════════════════════════════
function updateNowPlaying() {
  const titleEl = document.getElementById('npTitle');
  const artistEl = document.getElementById('npArtist');
  const thumbEl = document.getElementById('npThumb');
  const posEl = document.getElementById('npPosition');
  const playBtn = document.getElementById('btnPlayPause');

  if (currentIndex >= 0 && currentIndex < queueData.length) {
    const song = queueData[currentIndex];
    titleEl.textContent = song.title || 'Unknown';
    artistEl.textContent = song.artist || '—';
    if (song.thumbnail) {
      thumbEl.outerHTML = `<img class="np-thumb" id="npThumb" src="${song.thumbnail}" alt="" onerror="this.outerHTML='<div class=\\'np-thumb-placeholder\\' id=\\'npThumb\\'>🎙️</div>'">`;
    } else {
      thumbEl.outerHTML = `<div class="np-thumb-placeholder" id="npThumb">🎵</div>`;
    }
    posEl.textContent = `${currentIndex + 1} / ${queueData.length}`;
    playBtn.textContent = isPlaying ? '⏸️' : '▶️';
  } else {
    titleEl.textContent = 'No song playing';
    artistEl.textContent = 'Select a song from queue to start';
    const currentThumb = document.getElementById('npThumb');
    if (currentThumb && currentThumb.tagName !== 'DIV') {
      currentThumb.outerHTML = `<div class="np-thumb-placeholder" id="npThumb">🎙️</div>`;
    }
    posEl.textContent = '-- / --';
    playBtn.textContent = '▶️';
    isPlaying = false;
  }
}

async function playFromQueue(index) {
  await api('/api/play', 'POST', { index });
  isPlaying = true;
  refreshQueue();
}

async function togglePlay() {
  if (isPlaying) {
    await api('/api/pause', 'POST');
    isPlaying = false;
  } else {
    if (currentIndex < 0) {
      await api('/api/play', 'POST');
    } else {
      await api('/api/play', 'POST', { index: currentIndex });
    }
    isPlaying = true;
  }
  refreshQueue();
}

async function nextTrack() {
  await api('/api/next', 'POST');
  isPlaying = true;
  refreshQueue();
}

async function prevTrack() {
  await api('/api/prev', 'POST');
  isPlaying = true;
  refreshQueue();
}

// ═══════════════════════════════════════
// Add Songs
// ═══════════════════════════════════════
async function addYouTube() {
  const url = document.getElementById('ytUrl').value.trim();
  if (!url) { toast('Please enter a YouTube URL', 'error'); return; }

  const btn = document.getElementById('btnYtAdd');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    const data = await api('/api/youtube/add', 'POST', { url });
    if (data.ok) {
      toast(`✅ Added: ${data.song.title}`, 'success');
      document.getElementById('ytUrl').value = '';
      refreshQueue();
    } else {
      toast(`❌ ${data.error}`, 'error');
    }
  } catch (e) {
    toast('❌ An error occurred', 'error');
  } finally {
    btn.innerHTML = '➕';
    btn.disabled = false;
  }
}

async function addYouTubePlaylist() {
  const url = document.getElementById('ytPlaylistUrl').value.trim();
  if (!url) { toast('Please enter a YouTube Playlist URL', 'error'); return; }

  const btn = document.getElementById('btnYtPlaylist');
  btn.innerHTML = '<span class="spinner"></span> Loading...';
  btn.disabled = true;

  try {
    const data = await api('/api/youtube/playlist', 'POST', { url });
    if (data.ok) {
      toast(`✅ Add ${data.count} songs from playlist`, 'success');
      document.getElementById('ytPlaylistUrl').value = '';
      refreshQueue();
    } else {
      toast(`❌ ${data.error}`, 'error');
    }
  } catch (e) {
    toast('❌ An error occurred', 'error');
  } finally {
    btn.innerHTML = '📋 Playlist';
    btn.disabled = false;
  }
}

function addManual() {
  const title = document.getElementById('manualTitle').value.trim();
  if (!title) { toast('Please enter a song title', 'error'); return; }

  const artist = document.getElementById('manualArtist').value.trim();
  const duration = parseFloat(document.getElementById('manualDuration').value) || 0;

  api('/api/queue', 'POST', { title, artist, duration, source: 'local' }).then(data => {
    if (data.ok) {
      toast(`✅ Added: ${title}`, 'success');
      document.getElementById('manualTitle').value = '';
      document.getElementById('manualArtist').value = '';
      document.getElementById('manualDuration').value = '';
      refreshQueue();
    }
  });
}

function insertSong() {
  const pos = parseInt(document.getElementById('insertPosition').value);
  const title = document.getElementById('insertTitle').value.trim();
  if (isNaN(pos) || !title) { toast('Please enter position and song title', 'error'); return; }

  const artist = document.getElementById('insertArtist').value.trim();
  const duration = parseFloat(document.getElementById('insertDuration').value) || 0;

  api('/api/queue/insert', 'POST', { position: pos, title, artist, duration, source: 'local' }).then(data => {
    if (data.ok) {
      toast(`✅ Inserted at position ${pos}`, 'success');
      document.getElementById('insertPosition').value = '';
      document.getElementById('insertTitle').value = '';
      document.getElementById('insertArtist').value = '';
      document.getElementById('insertDuration').value = '';
      refreshQueue();
    }
  });
}

async function removeFromQueue(index) {
  await api(`/api/queue/${index}`, 'DELETE');
  refreshQueue();
}

async function clearQueue() {
  if (!confirm('Clear entire queue?')) return;
  await api('/api/queue/clear', 'POST');
  isPlaying = false;
  refreshQueue();
  toast('🗑️ Queue cleared', 'info');
}

// ═══════════════════════════════════════
// Library & Search
// ═══════════════════════════════════════
async function searchLibrary() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) {
    refreshLibrary();
    return;
  }
  const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
  renderLibraryList(data.results);
}

async function refreshLibrary() {
  const data = await api('/api/library');
  renderLibraryList(data.songs);
}

function renderLibraryList(songs) {
  const container = document.getElementById('libraryList');
  if (!songs || songs.length === 0) {
    container.innerHTML = '<div class="text-center text-muted mt-4">No songs in library</div>';
    return;
  }
  container.innerHTML = songs.map((s, i) => `
    <div class="library-item" onclick="addFromLibrary('${escAttr(s.id)}')">
      <div class="song-info">
        <div class="song-title">${s.source === 'youtube' ? '🔗' : '🎵'} ${escHtml(s.title)}</div>
        <div class="song-artist">${escHtml(s.artist || '—')} · ${formatDuration(s.duration)}</div>
      </div>
    </div>`).join('');
}

function escAttr(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
}

function addFromLibrary(songId) {
  // Find the song in our loaded library via API and add to queue
  api('/api/library').then(data => {
    const song = data.songs.find(s => s.id === songId);
    if (song) {
      api('/api/queue', 'POST', song).then(() => {
        toast(`✅ Add "${song.title}"  to queue`, 'success');
        refreshQueue();
      });
    }
  });
}

// ═══════════════════════════════════════
// Presets
// ═══════════════════════════════════════
async function refreshPresets() {
  const data = await api('/api/presets');
  const container = document.getElementById('presetList');
  const presets = data.presets;

  if (Object.keys(presets).length === 0) {
    container.innerHTML = '<div class="text-center text-muted mt-4">No Preset</div>';
    return;
  }

  container.innerHTML = Object.entries(presets).map(([name, count]) => `
    <div class="preset-item">
      <div>
        <div class="preset-name">📂 ${escHtml(name)}</div>
        <div class="preset-count">${count} songs</div>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="btn btn-sm btn-primary" onclick="loadPreset('${escAttr(name)}')">📥 Load</button>
        <button class="btn btn-sm btn-danger" onclick="deletePreset('${escAttr(name)}')">🗑️</button>
      </div>
    </div>`).join('');
}

function savePreset() {
  const name = document.getElementById('presetName').value.trim();
  if (!name) { toast('Please enter Preset', 'error'); return; }
  api('/api/preset/save', 'POST', { name }).then(data => {
    if (data.ok) {
      toast(`💾 Save Preset "${name}"`, 'success');
      document.getElementById('presetName').value = '';
      refreshPresets();
    }
  });
}

function loadPreset(name) {
  api('/api/preset/load', 'POST', { name }).then(data => {
    toast(`📂 Load Preset "${name}"`, 'success');
    refreshQueue();
    refreshPresets();
  });
}

async function deletePreset(name) {
  if (!confirm(`Delete preset "${name}"?`)) return;
  const data = await api('/api/preset/delete', 'POST', { name });
  if (data.ok) {
    toast(`🗑️ Deleted preset "${name}"`, 'success');
    refreshPresets();
  } else {
    toast(`❌ ${data.error}`, 'error');
  }
}

// ═══════════════════════════════════════
// History
// ═══════════════════════════════════════
async function refreshHistory() {
  const data = await api('/api/history');
  const container = document.getElementById('historyList');

  if (!data.history || data.history.length === 0) {
    container.innerHTML = '<div class="text-center text-muted mt-4">No history yet</div>';
    return;
  }

  container.innerHTML = data.history.slice().reverse().map((s, i) => `
    <div class="history-item">
      <span class="history-num">${i + 1}.</span>
      <div class="song-info">
        <div class="song-title">${s.source === 'youtube' ? '🔗' : '🎵'} ${escHtml(s.title)}</div>
        <div class="song-artist">${escHtml(s.artist || '—')}</div>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════════
// Save / Load / Demo
// ═══════════════════════════════════════
async function saveAll() {
  await api('/api/save', 'POST');
  toast('💾 Saved', 'success');
}

async function loadAll() {
  await api('/api/load', 'POST');
  toast('📂 Loaded', 'success');
  refreshQueue();
  refreshLibrary();
}

async function loadDemo() {
  await api('/api/demo', 'POST');
  toast('🎵 Load demo songs 10 songs', 'success');
  refreshQueue();
  refreshLibrary();
}

// ═══════════════════════════════════════
// Tab Switching
// ═══════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.sidebar-tab').forEach(el => el.classList.remove('active'));
  document.querySelector(`.sidebar-tab[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');

  // Refresh content on switch
  if (tab === 'library') refreshLibrary();
  if (tab === 'presets') refreshPresets();
  if (tab === 'history') refreshHistory();
  if (tab === 'log') refreshLogs();
}

// ═══════════════════════════════════════
// Log Viewer
// ═══════════════════════════════════════
const levelColors = {
  'DEBUG': '#8b949e',
  'INFO': '#e6edf3',
  'WARNING': '#d29922',
  'ERROR': '#f85149',
  'CRITICAL': '#ff4444'
};

async function refreshLogs() {
  const level = document.getElementById('logLevel').value;
  try {
    const data = await api(`/api/logs?level=${level}`);
    const viewer = document.getElementById('logViewer');
    const countEl = document.getElementById('logCount');
    countEl.textContent = `${data.count} entries (total: ${data.total})`;
    if (!data.logs.length) {
      viewer.innerHTML = '<span style="color:var(--text-muted)">No log entries yet.</span>';
      return;
    }
    let html = '';
    for (const entry of data.logs) {
      const color = levelColors[entry.level] || '#e6edf3';
      html += `<span style="color:${color}">[${entry.timestamp}] [${entry.level.padEnd(5)}] [${entry.logger}] ${escapeHtml(entry.message)}</span>\n`;
    }
    viewer.innerHTML = html;
    viewer.scrollTop = viewer.scrollHeight;
  } catch (e) {
    console.error('Failed to load logs:', e);
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function clearLogs() {
  await api('/api/logs/clear', 'POST');
  refreshLogs();
  toast('🗑️ Logs cleared', 'info');
}

let logRefreshInterval = null;
function startLogAutoRefresh() {
  if (logRefreshInterval) clearInterval(logRefreshInterval);
  logRefreshInterval = setInterval(() => {
    if (document.querySelector('.sidebar-tab[data-tab="log"].active')) refreshLogs();
  }, 1500);
}

// ═══════════════════════════════════════
// Keyboard Shortcuts
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  // Don't trigger when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      e.preventDefault();
      nextTrack();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      prevTrack();
      break;
  }
});

// ═══════════════════════════════════════
// Init
// ═══════════════════════════════════════
refreshQueue();
startLogAutoRefresh();

// Listen for log level change
document.getElementById('logLevel').addEventListener('change', refreshLogs);
</script>
